{% extends "base.html" %}

{% block title %}Editor - Notion AI Integration{% endblock %}

{% block content %}
<div class="editor-container">
    <h2>Page Editor</h2>
    
    <form id="page-form" class="editor-form">
        <div class="form-group">
            <label for="database-select">Target Database:</label>
            <select id="database-select" name="database_id" class="form-select" required>
                <option value="">Select a database...</option>
                <!-- Databases will be loaded dynamically -->
            </select>
        </div>
        
        <div class="form-group">
            <label for="page-title">Page Title:</label>
            <input type="text" id="page-title" name="title" class="form-input" required>
        </div>
        
        <div class="form-group">
            <label for="page-content">Content:</label>
            <textarea id="page-content" name="content" class="form-textarea" rows="15" placeholder="Enter your page content..."></textarea>
        </div>
        
        <div class="form-actions">
            <button type="button" id="preview-button" class="btn btn-secondary">Preview</button>
            <button type="submit" id="save-button" class="btn btn-primary">Save to Notion</button>
        </div>
    </form>
    
    <div id="preview-container" class="preview-container" style="display: none;">
        <h3>Preview</h3>
        <div id="preview-content" class="preview-content"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
